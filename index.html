<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status dashboard</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --done: #2da44e; --remain: #d0d7de; --warn: #bf8700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8d96a0; --remain:#30363d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 22px; }
  header .meta { color: var(--muted); font-size: 13px; }
  main { padding: 24px; display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card.summary { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .info { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge.yes { background: #dafbe1; color: #116329; }
  .badge.no { background: #fff8c5; color: #7d4e00; }
  .top { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .legend { font-size: 13px; line-height: 1.8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; }
  th { background: var(--bg); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; }
  .bar { height: 8px; background: var(--remain); border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar > span { display: block; height: 100%; background: var(--done); }
  .error { color: #cf222e; }
  .pie-wrap { position: relative; }
  .pie-wrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .pie-wrap .center b { font-size: 20px; }
  .pie-wrap .center small { color: var(--muted); font-size: 11px; }
  .small-pies { display: flex; flex-wrap: wrap; gap: 16px; }
  .small-pies figure { margin: 0; text-align: center; font-size: 12px; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Status dashboard</h1>
  <div class="meta">
    Načteno: <span id="loaded">–</span> · auto-refresh <span id="every"></span> s
    <button onclick="loadAll()">Obnovit</button>
  </div>
</header>
<main id="main"></main>

<script>
/* ======== NASTAVENÍ ======== */
// Názvy .md souborů ve stejné složce jako tento index.html
const FILES = [
  "HyperV_Status.md",
  "Server_Status.md",
];
const REFRESH_SECONDS = 60;
/* =========================== */

const COLORS = ["#2da44e","#0969da","#8250df","#bf3989","#bc4c00","#1a7f37","#0550ae","#6639ba"];
document.getElementById("every").textContent = REFRESH_SECONDS;

const num = s => {
  const n = parseFloat(String(s).replace(/\*/g,"").replace(/\s/g,"").replace(",", "."));
  return isNaN(n) ? 0 : n;
};
const clean = s => String(s).replace(/\*\*/g, "").trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseMd(text) {
  const lines = text.split(/\r?\n/);
  const res = { title: "", updated: "", finished: "", headers: [], rows: [], total: null };
  for (const l of lines) {
    const t = l.trim();
    if (!res.title && t.startsWith("# ")) res.title = t.slice(2).trim();
    let m;
    if ((m = t.match(/^Updated:\s*(.+)$/i))) res.updated = m[1].trim();
    if ((m = t.match(/^All finished:\s*(.+)$/i))) res.finished = m[1].trim();
  }
  const tbl = lines.map(l => l.trim()).filter(l => l.startsWith("|"));
  const cells = l => l.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  if (tbl.length) {
    res.headers = cells(tbl[0]);
    for (const l of tbl.slice(1)) {
      if (/^\|?\s*:?-{2,}/.test(l)) continue;           // oddělovač |---|
      const c = cells(l);
      if (/^\*\*total/i.test(c[0])) res.total = c; else res.rows.push(c);
    }
  }
  // Indexy sloupců podle názvu hlavičky (pořadí se může změnit)
  const idx = name => res.headers.findIndex(h => h.toLowerCase() === name);
  const iApp = Math.max(0, idx("app")), iDone = idx("done"), iRem = idx("remaining"), iLim = idx("limit");
  res.apps = res.rows.map(r => ({
    name: clean(r[iApp]),
    done: num(r[iDone]),
    remaining: num(r[iRem]),
    limit: iLim >= 0 ? num(r[iLim]) : num(r[iDone]) + num(r[iRem]),
  }));
  res.done = res.apps.reduce((a, b) => a + b.done, 0);
  res.remaining = res.apps.reduce((a, b) => a + b.remaining, 0);
  return res;
}

// SVG koláč/donut
function pie(segments, size = 160, hole = 0.6, centerHtml = "") {
  const total = segments.reduce((a, s) => a + s.value, 0) || 1;
  const r = size / 2, ri = r * hole;
  let a0 = -Math.PI / 2, paths = "";
  const pt = (rad, a) => [r + rad * Math.cos(a), r + rad * Math.sin(a)];
  for (const s of segments) {
    if (s.value <= 0) continue;
    const frac = s.value / total;
    if (frac >= 0.9999) {
      paths += `<circle cx="${r}" cy="${r}" r="${(r + ri) / 2}" fill="none" stroke="${s.color}" stroke-width="${r - ri}"><title>${esc(s.label)}: ${s.value}</title></circle>`;
      break;
    }
    const a1 = a0 + frac * 2 * Math.PI, large = frac > 0.5 ? 1 : 0;
    const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
    const d = ri > 0
      ? `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 ${large} 0 ${x3},${y3} Z`
      : `M${r},${r} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z`;
    paths += `<path d="${d}" fill="${s.color}" stroke="var(--card)" stroke-width="1"><title>${esc(s.label)}: ${s.value} (${(frac*100).toFixed(1)} %)</title></path>`;
    a0 = a1;
  }
  return `<div class="pie-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>
    <div class="center">${centerHtml}</div></div>`;
}

const pct = (d, r) => (d + r) ? (d / (d + r) * 100) : 0;
const fmtPct = p => p.toFixed(1).replace(".", ",") + " %";

function renderFile(name, d) {
  const p = pct(d.done, d.remaining);
  const appSegs = d.apps.map((a, i) => ({ label: a.name, value: a.done, color: COLORS[i % COLORS.length] }));
  const isDone = /^(yes|ano|true)$/i.test(d.finished);

  const rowsHtml = d.rows.map((r, ri) => {
    const a = d.apps[ri], ap = pct(a.done, a.remaining);
    return `<tr>${r.map((c, i) => `<td class="${i >= 2 && i <= 4 ? "num" : ""}">${esc(clean(c))}</td>`).join("")}
      <td><div class="bar" title="${fmtPct(ap)}"><span style="width:${ap}%"></span></div></td></tr>`;
  }).join("");
  const totalHtml = d.total ? `<tr class="total">${d.total.map((c, i) => `<td class="${i >= 2 && i <= 4 ? "num" : ""}">${esc(clean(c))}</td>`).join("")}
      <td><div class="bar"><span style="width:${p}%"></span></div></td></tr>` : "";

  const smallPies = d.apps.map(a => `<figure>${pie([
      { label: "Done", value: a.done, color: "var(--done)" },
      { label: "Remaining", value: a.remaining, color: "var(--remain)" }],
      80, 0.6, `<b style="font-size:12px">${Math.round(pct(a.done, a.remaining))}%</b>`)}
      <figcaption>${esc(a.name)}</figcaption></figure>`).join("");

  return `<section class="card">
    <h2>${esc(d.title || name)}</h2>
    <div class="info">Updated: ${esc(d.updated)} · All finished:
      <span class="badge ${isDone ? "yes" : "no"}">${esc(d.finished || "?")}</span> · <code>${esc(name)}</code></div>
    <div class="top">
      ${pie([{ label: "Done", value: d.done, color: "var(--done)" },
             { label: "Remaining", value: d.remaining, color: "var(--remain)" }], 150, 0.62,
            `<b>${fmtPct(p)}</b><small>${d.done} / ${d.done + d.remaining}</small>`)}
      ${d.apps.length > 1 ? pie(appSegs, 150, 0, "") : ""}
      ${d.apps.length > 1 ? `<div class="legend"><div style="color:var(--muted)">Done podle App</div>${appSegs.map(s =>
        `<div><span class="dot" style="background:${s.color}"></span>${esc(s.label)}: ${s.value}</div>`).join("")}</div>` : ""}
    </div>
    <div class="small-pies" style="margin-bottom:14px">${smallPies}</div>
    <table>
      <thead><tr>${d.headers.map((h, i) => `<th class="${i >= 2 && i <= 4 ? "num" : ""}">${esc(h)}</th>`).join("")}<th>Progress</th></tr></thead>
      <tbody>${rowsHtml}${totalHtml}</tbody>
    </table>
  </section>`;
}

function renderSummary(results) {
  const ok = results.filter(r => r.data);
  const done = ok.reduce((a, r) => a + r.data.done, 0);
  const rem = ok.reduce((a, r) => a + r.data.remaining, 0);
  const segs = ok.map((r, i) => ({ label: r.data.title || r.name, value: r.data.done, color: COLORS[i % COLORS.length] }));
  return `<section class="card summary">
    ${pie([{ label: "Done", value: done, color: "var(--done)" }, { label: "Remaining", value: rem, color: "var(--remain)" }],
          170, 0.62, `<b>${fmtPct(pct(done, rem))}</b><small>celkem</small>`)}
    <div class="legend" style="font-size:15px">
      <div><b>Celkem hotovo:</b> ${done} / ${done + rem}</div>
      <div><b>Zbývá:</b> ${rem}</div>
      <div><b>Hotových souborů:</b> ${ok.filter(r => /^(yes|ano|true)$/i.test(r.data.finished)).length} / ${ok.length}</div>
    </div>
    ${segs.length > 1 ? pie(segs, 140, 0, "") : ""}
    ${segs.length > 1 ? `<div class="legend"><div style="color:var(--muted)">Done podle souboru</div>${segs.map(s =>
      `<div><span class="dot" style="background:${s.color}"></span>${esc(s.label)}: ${s.value}</div>`).join("")}</div>` : ""}
  </section>`;
}

async function loadAll() {
  const results = await Promise.all(FILES.map(async name => {
    try {
      const r = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return { name, data: parseMd(await r.text()) };
    } catch (e) { return { name, error: e.message }; }
  }));
  document.getElementById("main").innerHTML =
    renderSummary(results) +
    results.map(r => r.data ? renderFile(r.name, r.data)
      : `<section class="card"><h2>${esc(r.name)}</h2><p class="error">Nepodařilo se načíst: ${esc(r.error)}</p></section>`).join("");
  document.getElementById("loaded").textContent = new Date().toLocaleString("cs-CZ");
}

loadAll();
setInterval(loadAll, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
